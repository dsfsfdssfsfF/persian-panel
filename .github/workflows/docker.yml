version: '3.8'

services:
  panel:
    build: .
    container_name: persian-panel
    restart: unless-stopped
    ports:
      - "2053:2053"
    environment:
      - PORT=2053
      - DOMAIN=${DOMAIN:-localhost}
      - PANEL_PATH=/panel
      - NODE_ENV=production
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
      - TZ=Asia/Tehran
    volumes:
      - ./data:/app/data
