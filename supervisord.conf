[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
loglevel=info

[program:nodejs]
command=node /app/server.js
directory=/app
autostart=true
autorestart=true
startsecs=3
stderr_logfile=/var/log/supervisor/node.err.log
stdout_logfile=/var/log/supervisor/node.out.log
environment=NODE_ENV="production",PORT="3000"
priority=10

[program:xray]
command=/usr/local/bin/xray run -c /etc/xray/config.json
autostart=true
autorestart=true
startsecs=3
stderr_logfile=/var/log/supervisor/xray.err.log
stdout_logfile=/var/log/supervisor/xray.out.log
priority=20
